<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="gate.page_title">Staff Gate | Lux Lusitana</title>

    <!-- CRITICAL: Tailwind CSS - Doctrina R3 Zero-Hex -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrapper - Antigravity -->
    <script src="core/at-bootstrapper.js"></script>

    <!-- PENDING: Firebase SDK - Antigravity (DT-004) -->
    <!-- <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-app-compat.js"></script> -->
    <!-- <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-auth-compat.js"></script> -->

    <!-- i18n Engine - Doctrina R4 Strict (DT-005) -->
    <!-- <script src="core/i18n.js" defer></script> -->

    <style>
        :root {
            --theme-carbon: #0a0a0a;
            --theme-gold: #d4af37;
            --theme-platinum: #e5e4e2;
            --theme-bg-surface: #111111;
            --theme-border: #2a2a2a;
        }

        body {
            background-color: var(--theme-carbon);
            color: var(--theme-platinum);
            font-family: 'Georgia', serif;
        }

        .gate-btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--theme-border);
            background: #1a1a1a;
            color: var(--theme-platinum);
            border-radius: 0.5rem;
            transition: all 200ms ease;
        }

        .gate-btn-oauth:hover:not(:disabled) {
            border-color: var(--theme-gold);
            background: #222;
        }

        .gate-btn-primary {
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--theme-gold);
            color: var(--theme-gold);
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 0.5rem;
            transition: all 200ms ease;
        }

        .gate-btn-primary:hover:not(:disabled) {
            background: var(--theme-gold);
            color: var(--theme-carbon);
        }

        .gate-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1a1a1a;
            border: 1px solid var(--theme-border);
            color: white;
            border-radius: 0.5rem;
            outline: none;
        }

        .gate-input:focus {
            border-color: var(--theme-gold);
        }

        [data-gate-lock]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Gate Portal - Zona de Validación Fiduciaria -->
    <main id="golden-gate-root" data-tenant-id="cpii_lux_v1.0" data-gate-lock data-gate-state="idle"
        class="relative w-full max-w-md mx-auto">

        <!-- Header -->
        <header class="text-center mb-8">
            <div class="mb-4 flex justify-center">
                <div class="w-12 h-12 border border-gold/40 rounded flex items-center justify-center">
                    <span class="text-gold text-2xl font-mono">⬡</span>
                </div>
            </div>
            <h1 class="text-xl tracking-widest uppercase mb-1" data-i18n="gate.headline">Staff Entrance</h1>
            <p class="text-xs text-zinc-500 uppercase tracking-tighter" data-i18n="gate.subheadline">Authorized Personnel Only</p>
        </header>

        <!-- Content Layer -->
        <div data-gate-content class="relative z-10 bg-zinc-900/50 backdrop-blur-md rounded-xl border border-white/5 p-8 shadow-2xl">
            
            <!-- Elite Federated Access -->
            <div class="space-y-3 mb-6">
                <button id="gate-btn-google" class="gate-btn-oauth" disabled>
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4" />
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853" />
                        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05" />
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335" />
                    </svg>
                    <span data-i18n="gate.continue_google">Staff Google Login</span>
                </button>
                <button id="gate-btn-apple" class="gate-btn-oauth" disabled>
                    <span data-i18n="gate.continue_apple">Staff Apple Login</span>
                </button>
            </div>

            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-[10px] uppercase text-zinc-600">or manual</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Manual Section -->
            <div class="space-y-4">
                <input id="gate-email-input" type="email" class="gate-input" placeholder="Institutional Email" disabled>
                <button id="gate-btn-manual-submit" class="gate-btn-primary" disabled>
                    <span data-i18n="gate.manual_submit">Request Access Link</span>
                </button>
            </div>

            <!-- Messages -->
            <div id="gate-manual-confirm" class="hidden mt-4 text-xs text-gold text-center" data-i18n="auth.manual_link_sent">
                Link sent to your institutional email.
            </div>

        </div>

        <!-- Utility Slots -->
        <div id="gate-state-loading" class="hidden absolute inset-0 z-40 bg-black/80 flex items-center justify-center">
            <span class="text-xs text-zinc-500 animate-pulse" data-i18n="gate.state_loading">Securing connection...</span>
        </div>

        <div id="gate-state-error" class="hidden mt-4 p-3 border border-red-500/20 bg-red-500/5 rounded text-red-500 text-xs text-center">
            <p id="gate-error-message" data-i18n="gate.state_error_generic">Authentication failed.</p>
        </div>

        <div id="gate-state-success" class="hidden mt-4 text-gold text-xs text-center uppercase tracking-widest" data-i18n="gate.state_success">
            Access Granted. Redirecting...
        </div>

    </main>

    <!-- Drivers -->
    <script src="core/passport-engine.js"></script>
    <script src="features/at-admin-gate.js"></script>

</body>

</html>
